
<p th:if="${error}" th:text="${error}" class="error"></p>

<div class="card">
        <form th:action="@{/register}" method="POST">

			<div>
			    <label>Name</label>
			    <input type="text" required th:field="${user.nome}"/>
			    <span th:if="${#fields.hasErrors('user.nome')}"
			          th:errors="${user.nome}" style="color: red;"></span>
			</div>
			<div>
				<label>Surname</label>
				<input type="text" required th:field="${user.surname}"/>
				<span th:if="${#fields.hasErrors('user.surname')}"
					  th:errors="${user.surname}" style="color: red;"></span>
			</div>
            <div>
                <label>Cellphone</label>
                <input type="tel" required th:field="${user.cellphone}"/>
                <span th:if="${#fields.hasErrors('user.cellphone')}"
                      th:errors="${user.cellphone}" style="color: red;"></span>
            </div>

            <div>
                <label>Username</label>
                <input type="text" required th:field="${credenziali.username}"/>
                <span th:if="${#fields.hasErrors('credenziali.username')}"
                      th:errors="${credenziali.username}" style="color: red;"></span>
            </div>

            <div>
                <label>Password</label>
                <input type="password" required th:field="${credenziali.password}" />
                <span th:if="${#fields.hasErrors('credenziali.password')}"
                      th:errors="${credenziali.password}" style="color: red;"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Crea account</button>
				<a th:href="@{/login}">area personale</a>
				<a th:href="@{/}">home</a>
            </div>

        </form>
    </div>
