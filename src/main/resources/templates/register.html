<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrazione - Dottor Veicolo</title>

    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<body>

    <p
        th:if="${error}"
        th:text="${error}"
        class="error">
    </p>


    <div class="card">

        <h1 class="sottotitolo">
            📝 Crea il tuo account
        </h1>

        <form th:action="@{/register}" method="POST">

            <div>
                <label>Name</label>

                <input
                    type="text"
                    required
                    th:field="${user.nome}"
                    placeholder="Nome"
                />

                <span
                    th:if="${#fields.hasErrors('user.nome')}"
                    th:errors="${user.nome}"
                    style="color: red;">
                </span>
            </div>


            <div>
                <label>Surname</label>

                <input
                    type="text"
                    required
                    th:field="${user.surname}"
                    placeholder="Cognome"
                />

                <span
                    th:if="${#fields.hasErrors('user.surname')}"
                    th:errors="${user.surname}"
                    style="color: red;">
                </span>
            </div>


            <div>
                <label>Cellphone</label>

                <input
                    type="tel"
                    required
                    th:field="${user.cellphone}"
                    placeholder="Numero di telefono"
                />

                <span
                    th:if="${#fields.hasErrors('user.cellphone')}"
                    th:errors="${user.cellphone}"
                    style="color: red;">
                </span>
            </div>


            <div>
                <label>Username</label>

                <input
                    type="text"
                    required
                    th:field="${credenziali.username}"
                    placeholder="Scegli un username"
                />

                <span
                    th:if="${#fields.hasErrors('credenziali.username')}"
                    th:errors="${credenziali.username}"
                    style="color: red;">
                </span>
            </div>


            <div>
                <label>Password</label>

                <input
                    type="password"
                    required
                    th:field="${credenziali.password}"
                    placeholder="Scegli una password"
                />

                <span
                    th:if="${#fields.hasErrors('credenziali.password')}"
                    th:errors="${credenziali.password}"
                    style="color: red;">
                </span>
            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                    style="width: 100%;">
                    Crea account
                </button>

            </div>

        </form>

    </div>


    <div style="text-align: center; margin-bottom: 40px;">

        <p>
            Hai già un account?
            <a th:href="@{/login}">Area personale</a>
        </p>

        <p>
            <a th:href="@{/}">← Torna alla home</a>
        </p>

    </div>

</body>
</html>
