<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestione Auto - Dottor Veicolo</title>

    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<body>

<header id="titolo">

    <img
        th:src="@{/images/titleBackground.jpg}"
        id="sfondoTitolo"
        alt="Sfondo officina"/>

    <strong id="pageName">
        🚗 MODIFICA AUTO
    </strong>

    <a th:href="@{/admin}" id="register">
        Admin
    </a>

</header>


<main class="management-page">

    <p
        th:if="${error}"
        th:text="${error}"
        class="error">
    </p>


    <!-- AGGIUNGI AUTO -->

    <section class="card management-card">

        <div class="management-title">
            <span class="management-icon">➕</span>

            <div>
                <h1>Aggiungi auto</h1>
                <p>Inserisci i dati della nuova vettura.</p>
            </div>
        </div>


        <form th:action="@{/auto}" method="POST">

            <div>
                <label for="plate">Targa</label>

                <input
                    type="text"
                    id="plate"
                    required
                    th:field="${automobile.plate}"
                    placeholder="Es. AB123CD"/>

                <span
                    th:if="${#fields.hasErrors('automobile.plate')}"
                    th:errors="${automobile.plate}"
                    class="field-error">
                </span>
            </div>


            <div>
                <label for="model">Modello</label>

                <input
                    type="text"
                    id="model"
                    required
                    th:field="${automobile.model}"
                    placeholder="Es. Fiat Panda"/>

                <span
                    th:if="${#fields.hasErrors('automobile.model')}"
                    th:errors="${automobile.model}"
                    class="field-error">
                </span>
            </div>


            <div>
                <label for="country">
                    Paese immatricolazione
                </label>

                <input
                    type="text"
                    id="country"
                    required
                    th:field="${automobile.country}"
                    placeholder="Es. Italia"/>

                <span
                    th:if="${#fields.hasErrors('automobile.country')}"
                    th:errors="${automobile.country}"
                    class="field-error">
                </span>
            </div>


            <div>
                <label for="userId">
                    Proprietario
                </label>

                <select
                    id="userId"
                    name="userId"
                    required>

                    <option value="">
                        -- Seleziona proprietario --
                    </option>

                    <option
                        th:each="user : ${users}"
                        th:value="${user.id}"
                        th:text="${user.id + ' - ' + user.nome + ' ' + user.surname}">
                    </option>

                </select>
            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary">
                    ✓ Conferma
                </button>

                <a
                    th:href="@{/admin}"
                    class="btn">
                    Annulla
                </a>

            </div>

        </form>

    </section>


    <!-- ELIMINA AUTO -->

    <section class="card management-card danger-card">

        <div class="management-title">

            <span class="management-icon">🗑️</span>

            <div>
                <h1>Elimina auto</h1>
                <p>Seleziona una vettura da rimuovere.</p>
            </div>

        </div>


        <form th:action="@{/autoRem}" method="POST">

            <div>

                <label for="autoId">
                    Auto
                </label>

                <select
                    id="autoId"
                    name="autoId"
                    required>

                    <option value="">
                        -- Seleziona auto --
                    </option>

                    <option
                        th:each="car : ${auto}"
                        th:value="${car.id}"
                        th:text="${car.id + ' - ' + car.plate + ' - ' + car.model}">
                    </option>

                </select>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-danger">
                    🗑 Elimina
                </button>

                <a
                    th:href="@{/admin}"
                    class="btn">
                    ← Indietro
                </a>

            </div>

        </form>

    </section>

</main>

</body>
</html>
